# Official local stack. Same file on Windows and later on the Mac mini.
# Bind published ports to 127.0.0.1 only. Do not add Open WebUI Computer.
# Settings in this file are the source of truth (ENABLE_PERSISTENT_CONFIG=false).
# Account, chats, prompts, and models live in ./data on the host (not named
# volumes). `docker compose down -v` does not delete that folder. Back up with
# scripts/backup-local-data.ps1. Do not commit ./data or ./backups.

name: assistant-cabinet

services:
  ollama:
    image: ollama/ollama:${OLLAMA_DOCKER_TAG:-latest}
    container_name: assistant-cabinet-ollama
    restart: unless-stopped
    # Listen on all interfaces *inside* the Compose network. The host mapping
    # below keeps the published port on localhost only.
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      # This Docker VM has a fixed memory budget; two large models resident at once can exceed
      # it and crash the model load (see docs/HARDWARE.md). One at a time, evicted on switch.
      OLLAMA_MAX_LOADED_MODELS: ${OLLAMA_MAX_LOADED_MODELS:-1}
    ports:
      - "127.0.0.1:${OLLAMA_HOST_PORT:-11434}:11434"
    volumes:
      - ./data/ollama:/root/.ollama
    networks:
      - cabinet
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 20s
    # Optional NVIDIA GPU. Uncomment only if the NVIDIA Container Toolkit is installed.
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  # The gateway. Every client talks to it, never to Ollama: aliases, the output-language
  # directive, no-store and the metadata register all live here. It writes nothing to disk, so it
  # has no volume and runs unprivileged.
  server:
    build:
      context: ./apps/server
    container_name: assistant-cabinet-server
    restart: unless-stopped
    depends_on:
      ollama:
        condition: service_healthy
    ports:
      - "127.0.0.1:${SERVER_HOST_PORT:-8080}:8080"
    environment:
      # Reachable inside the Compose network only. Port 11434 stays off the practice LAN.
      LLM_BASE_URL: http://ollama:11434
      # `alias=model` pairs: Compose cannot interpolate a default containing braces, so the JSON
      # form is left for a hand-written .env. A weight name belongs here, never in code.
      MODEL_ALIASES: ${MODEL_ALIASES:-cabinet-chat=mistral,cabinet-rapide=mistral,cabinet-embed=nomic-embed-text}
      DEFAULT_MODEL_ALIAS: ${DEFAULT_MODEL_ALIAS:-cabinet-chat}
      # Indexing asks for its own alias out of the same allow-list. Changing which model builds
      # the vectors means re-indexing the work folder, never editing a client.
      DEFAULT_EMBEDDING_ALIAS: ${DEFAULT_EMBEDDING_ALIAS:-cabinet-embed}
      # Safety net for a request that arrives without an output locale. Never silently English.
      DEFAULT_OUTPUT_LOCALE: ${DEFAULT_OUTPUT_LOCALE:-fr-FR}
      MAX_CONTEXT_CHARS: ${MAX_CONTEXT_CHARS:-48000}
      # The counterpart: how long an answer may be. Not a tuning knob - without it a model that
      # falls into a repetition loop writes until a client gives up (docs/TROUBLESHOOTING.md).
      MAX_OUTPUT_TOKENS: ${MAX_OUTPUT_TOKENS:-2048}
      # Indexing sends batches of chunks, so it is capped on both count and size.
      MAX_EMBEDDING_INPUTS: ${MAX_EMBEDDING_INPUTS:-256}
      MAX_EMBEDDING_CHARS: ${MAX_EMBEDDING_CHARS:-200000}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    networks:
      - cabinet

  open-webui:
    image: ghcr.io/open-webui/open-webui:${WEBUI_DOCKER_TAG:-main}
    container_name: assistant-cabinet-open-webui
    restart: unless-stopped
    depends_on:
      ollama:
        condition: service_healthy
      server:
        condition: service_healthy
    ports:
      - "127.0.0.1:${OPEN_WEBUI_HOST_PORT:-3000}:8080"
    environment:
      # The owner workbench goes through the gateway like any other client, so what it sees is
      # the alias catalogue rather than the model shelf.
      ENABLE_OLLAMA_API: "false"
      OPENAI_API_BASE_URL: http://server:8080/v1
      # The gateway does not check keys yet (per-person keys are sprint 4); a value is sent
      # because the client insists on one.
      OPENAI_API_KEY: ${GATEWAY_API_KEY:-local-owner-key}
      WEBUI_AUTH: "true"
      # Compose wins over the Admin UI after restart. New machines get the same flags.
      ENABLE_PERSISTENT_CONFIG: ${ENABLE_PERSISTENT_CONFIG:-false}
      DEFAULT_LOCALE: en-US
      DEFAULT_MODEL_PARAMS: '{"function_calling":"legacy"}'
      # First visitor becomes admin. After that account exists, set ENABLE_SIGNUP=false in .env.
      ENABLE_SIGNUP: ${ENABLE_SIGNUP:-true}
      ENABLE_OPENAI_API: "true"
      ENABLE_COMMUNITY_SHARING: "false"
      ENABLE_WEB_SEARCH: "false"
      # No follow-up questions (they invent clinical next steps). No auto-tags.
      ENABLE_FOLLOW_UP_GENERATION: "false"
      ENABLE_TAGS_GENERATION: "false"
      # Starter chips: English workbench; model must still answer in French.
      DEFAULT_PROMPT_SUGGESTIONS: >-
        [{"title":["Letter summary","Fictional specialist report"],"content":"You are an admin assistant, not a clinician. The user will paste a fictional specialist letter. Reply in French only. 5 to 8 bullets. At most five full-sentence citations, one per fact, no duplicates. No diagnosis, no send. End exactly with: Synthèse d'aide à la lecture. La médecin reste seule décideuse. Pas d'envoi automatique."},{"title":["Filing plan","Fictional incoming files"],"content":"You are an admin assistant. The user will list fictional files. Reply in French only. Output a Markdown table only. Never JSON, never tool calls, never delete or move. Keep the real extension. French filename stems (lettre-specialiste, not specialist-letter). Flag duplicates with _doublon. Proposed folder: a-traiter. Do not write to disk."}]
      # Chat titles: French only.
      TITLE_GENERATION_PROMPT_TEMPLATE: >-
        Generate a concise chat title of 2 to 6 words.
        The title MUST be in French only. Never English. No emoji, no quotation marks.
        Output JSON only: {"title": "your title"}
        Chat history: {{MESSAGES:END:2}}
      WEBUI_SECRET_KEY: ${WEBUI_SECRET_KEY:-change-me-locally}
      SCARF_NO_ANALYTICS: "true"
      DO_NOT_TRACK: "true"
      ANONYMIZED_TELEMETRY: "false"
    volumes:
      - ./data/open-webui:/app/backend/data
    networks:
      - cabinet

networks:
  cabinet:
    driver: bridge
