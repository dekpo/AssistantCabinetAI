[package]
name = "assistant-cabinet-ai"
version = "0.1.0"
description = "Assistant Cabinet AI - local administrative assistance for professional practices"
authors = ["Assistant Cabinet AI"]
edition = "2021"
rust-version = "1.82"

[lib]
name = "assistant_cabinet_ai_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
# Copy/edit/regenerate (docs/CHAT-UX-ASSESSMENT.md items 3-4): `navigator.clipboard.writeText`
# needs a secure context, which the webview only guarantees on Windows, not on macOS
# (AGENTS.md: both platforms are mandatory), so clipboard access goes through this plugin instead.
tauri-plugin-clipboard-manager = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
# rustls rather than the platform stack: one behaviour on Windows and on macOS.
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "stream",
    "rustls-tls",
] }
futures-util = "0.3"
# `macros` for `select!`, which is how a question in flight is dropped when she stops it.
tokio = { version = "1", features = ["macros", "sync", "time"] }
sys-locale = "0.3"
# Keeps Windows paths readable instead of the \\?\ form canonicalize returns.
dunce = "1"
pdf-extract = "0.12.1"
rusqlite = { version = "0.40.2", features = ["bundled"] }
zip = "5.0.1"
quick-xml = "0.41.0"
walkdir = "2.5.0"
sha2 = "0.10.9"
# Accent-free, single-form file names and matching (`filename_sanitizer`, `file_reference`).
unicode-normalization = "0.1"
# The identifier patterns of the knowledge base's lexicon packs (`knowledge::packs`). Already in the
# dependency tree through tauri-utils, so this adds no new code to the build. Linear-time matching
# (no backtracking, hence no ReDoS) and pure Rust on both platforms; `unicode-perl` and
# `unicode-case` are the two features a pattern with `\d`, `\s` or `(?i)` needs.
regex = { version = "1", default-features = false, features = ["std", "perf", "unicode-perl", "unicode-case"] }

# Tabular pipeline (docs/ARCHITECTURE.md): CSV/XLSX are a first-class source with their own
# adapters, never flattened into text chunks and never routed through document embeddings.
# `dates`: calamine's own date/time conversion (chrono), so an XLSX date or datetime cell reads
# as a real calendar value instead of the raw serial number the file stores (docs/DECISIONS.md,
# D3). No system locale involved: both pure Rust, both platforms.
calamine = { version = "0.26", features = ["dates"] }
csv = "1"
# CP1252 decoding for a CSV a French Windows export did not save as UTF-8.
encoding_rs = "0.8"
# The one pure-Rust date crate for the tabular pipeline (D3): already resolved transitively
# through calamine's own `dates` feature, so this is the same version, not a second one.
# `serde`: lets a `CellValue::Date` round-trip through the typed workbook cache
# (`docs/SESSION-DATA-13-Column-Cache.md`) without a second date representation.
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }

# Rasterises a PDF page to a bitmap in memory, feeding the OCR port (docs/SPRINT-2.5-ASSESSMENT.md
# section E). No `#[cfg(windows)]`: the platform difference is which prebuilt pdfium library is
# bundled as a resource, resolved at runtime, never in this crate's code.
pdfium-render = { version = "0.9.4", default-features = false, features = [
    "image_025",
    "pdfium_7881",
    "thread_safe",
] }
image = { version = "0.25.6", default-features = false, features = ["png"] }

[dev-dependencies]
tempfile = "3"
tiny_http = "0.12.0"
tokio = { version = "1", features = ["rt", "macros", "rt-multi-thread"] }
