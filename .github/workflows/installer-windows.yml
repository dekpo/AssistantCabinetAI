name: Windows installer

# The installer with its helper programs inside (decision of 19 October 2026, docs/DECISIONS.md, "Where the
# helper programs and the models live"). Started by hand, never on a push or a pull request: it downloads the
# sherpa-onnx libraries and Tesseract and builds two release executables and the application, which is far
# too heavy for every change, and ci.yml needs none of it (the packaging entries are in
# apps/desktop/src-tauri/tauri.bundle.conf.json, not in tauri.conf.json). The same script the owner runs
# does the work: scripts/build-installer.sh. The installer is an artifact for fictional-data tests; handing it
# to the pilot stays gated by AGENTS.md, item 6. macOS has no step yet (docs/SESSION-SPEECH, phase 14).
# Not yet run on a GitHub runner: the first run is the test of this file.

on:
  workflow_dispatch:

jobs:
  installer:
    name: installer (windows-latest)
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            apps/desktop/src-tauri
            apps/speech-worker

      - uses: pnpm/action-setup@v4
        with:
          version: 12

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml

      - name: Install JS dependencies
        working-directory: apps/desktop
        run: pnpm install --frozen-lockfile

      - name: Fetch the sherpa-onnx libraries
        run: bash scripts/fetch-speech-resources.sh

      - name: Fetch Tesseract, the French model and pdfium
        shell: powershell
        run: ./scripts/fetch-ocr-resources.ps1

      - name: Build the installer
        run: bash scripts/build-installer.sh --bundles nsis

      - uses: actions/upload-artifact@v4
        with:
          name: installer-windows
          path: apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
