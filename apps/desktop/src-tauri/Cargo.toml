[package]
name = "assistant-cabinet-ai"
version = "0.1.0"
description = "Assistant Cabinet AI - local administrative assistance for professional practices"
authors = ["Assistant Cabinet AI"]
edition = "2021"
rust-version = "1.82"

[lib]
name = "assistant_cabinet_ai_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
# rustls rather than the platform stack: one behaviour on Windows and on macOS.
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "stream",
    "rustls-tls",
] }
futures-util = "0.3"
tokio = { version = "1", features = ["sync", "time"] }
sys-locale = "0.3"
# Keeps Windows paths readable instead of the \\?\ form canonicalize returns.
dunce = "1"
pdf-extract = "0.12.1"
rusqlite = { version = "0.40.2", features = ["bundled"] }
zip = "5.0.1"
quick-xml = "0.41.0"
walkdir = "2.5.0"
sha2 = "0.10.9"

[dev-dependencies]
tempfile = "3"
tiny_http = "0.12.0"
tokio = { version = "1", features = ["rt", "macros", "rt-multi-thread"] }
