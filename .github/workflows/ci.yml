name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  desktop:
    name: desktop (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: apps/desktop
    env:
      # No debug information in the test binaries: about forty executables are linked on each runner,
      # and writing their debug files (PDB on Windows) is most of the time of the step. A failure
      # still prints its message and the line of the assertion.
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - uses: pnpm/action-setup@v4
        with:
          version: 12

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      - name: TypeScript check and build
        run: pnpm run build

      - name: vitest
        run: pnpm run test

      # The library tests and every integration target that is not #[ignore], in one invocation so that
      # the crate is built once: the knowledge base, the tabular engine and the router are proved in
      # the integration targets, not in the library. A target that needs something a runner lacks is
      # fixed, never skipped.
      - name: cargo test (library and integration targets)
        working-directory: apps/desktop/src-tauri
        run: cargo test --lib --tests --no-fail-fast

  server:
    name: server (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: apps/server
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --extra dev

      - name: ruff
        run: uv run ruff check .

      - name: pytest
        run: uv run pytest
